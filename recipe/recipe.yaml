schema_version: 1

context:
  name: mache
  version: "5.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://github.com/E3SM-Project/mache/archive/refs/tags/${{ version }}.tar.gz
  sha256: f4afc7a5b9a4558b17518d5a6a4bad962ac9fe4cbeba691ef78f6c6922b45c3d

build:
  number: 0
  noarch: python

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=60
  run:
    - python >=${{ python_min }}
    - importlib_resources
    - jinja2 >=2.9
    - lxml
    - packaging
    - pyyaml
    - requests
    - termcolor
    - tqdm
    - rsync

tests:
  - python:
      imports:
        - mache
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - mache deploy init --help
      - mache deploy update --help
      - mache deploy run --help
      - mache jigsaw install --help
      - mache sync diags --help

about:
  license: BSD-3-Clause
  license_file: LICENSE
  summary: A package for providing configuration data relate to E3SM supported machines
  homepage: https://github.com/E3SM-Project/mache
  repository: https://github.com/E3SM-Project/mache
  documentation: https://docs.e3sm.org/mache/

extra:
  recipe-maintainers:
    - andrewdnolan
    - xylar
